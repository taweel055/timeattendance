[supervisord]
nodaemon=true
user=root
logfile=/app/logs/supervisord.log
pidfile=/var/run/supervisord.pid

[program:attendance-backend]
command=node server.js
directory=/app/backend
user=attendance
environment=NODE_ENV=production,PORT=5000,DATABASE_PATH="/app/data/attendance.db"
autostart=true
autorestart=true
startretries=3
stderr_logfile=/app/logs/backend_error.log
stdout_logfile=/app/logs/backend_access.log
redirect_stderr=false

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
startretries=3
stderr_logfile=/app/logs/nginx_supervisor_error.log
stdout_logfile=/app/logs/nginx_supervisor_access.log
redirect_stderr=false

[inet_http_server]
port=127.0.0.1:9001

[supervisorctl]
serverurl=http://127.0.0.1:9001

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface