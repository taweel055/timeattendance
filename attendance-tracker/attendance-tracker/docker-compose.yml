version: '3.8'

services:
  attendance-tracker:
    build: .
    container_name: attendance-tracker
    restart: unless-stopped
    ports:
      - "80:80"
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      - PORT=5000
      - DATABASE_PATH=/app/data/attendance.db
      - UPLOAD_PATH=/app/data/uploads
    volumes:
      - attendance-data:/app/data
      - attendance-logs:/app/logs
      - ./backend/uploads:/app/data/uploads
    networks:
      - attendance-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: attendance-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - attendance-network
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

  nginx:
    image: nginx:alpine
    container_name: attendance-nginx
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - ./ubuntu/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ubuntu/nginx/ssl:/etc/nginx/ssl:ro
      - attendance-logs:/var/log/nginx
    networks:
      - attendance-network
    depends_on:
      - attendance-tracker
    profiles:
      - ssl

  # Development database admin (optional)
  adminer:
    image: adminer:4.8.1
    container_name: attendance-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: attendance-tracker
    networks:
      - attendance-network
    profiles:
      - admin

  # Backup service
  backup:
    image: alpine:latest
    container_name: attendance-backup
    restart: "no"
    volumes:
      - attendance-data:/data:ro
      - ./backups:/backups
    networks:
      - attendance-network
    command: |
      sh -c "
        apk add --no-cache tar gzip &&
        cd /data &&
        tar -czf /backups/attendance-backup-$$(date +%Y%m%d-%H%M%S).tar.gz . &&
        find /backups -name 'attendance-backup-*.tar.gz' -mtime +7 -delete &&
        echo 'Backup completed successfully'
      "
    profiles:
      - backup

volumes:
  attendance-data:
    driver: local
  attendance-logs:
    driver: local
  redis-data:
    driver: local

networks:
  attendance-network:
    driver: bridge